name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked --group test
      - name: Lint
        run: |
          uv run --group test ruff check langchain_islo tests
          uv run --group test ruff format langchain_islo tests --diff
      - name: Type check
        run: uv run --group test ty check langchain_islo
      - name: Unit tests
        run: uv run --group test pytest tests/unit_tests tests/test_import.py -q --disable-socket --allow-unix-socket
