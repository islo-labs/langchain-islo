name: Docker image

# Builds and verifies docker/Dockerfile. islo-runner isn't pullable in CI, so we
# build against a public base via BASE_IMAGE and assert the python3 + GNU grep
# contract Deep Agents requires. Production builds use the default islo-runner base.

on:
  pull_request:
    paths: [docker/**, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      base_image:
        description: Base image to build from
        default: docker.io/library/python:3.12-slim

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build sandbox image (public base)
        run: |
          docker buildx build \
            --build-arg BASE_IMAGE="${{ github.event.inputs.base_image || 'docker.io/library/python:3.12-slim' }}" \
            -f docker/Dockerfile -t langchain-islo-sandbox:ci --load .
      - name: Verify python3 + GNU grep present
        run: |
          docker run --rm langchain-islo-sandbox:ci sh -c '
            python3 --version &&
            grep --version | head -1 &&
            grep --version | head -1 | grep -q "GNU grep"'
